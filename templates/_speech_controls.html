<details class="audio-settings">
  <summary>♬ आवाज़ जाँचें / Audio check</summary>
  <p>नमस्ते। आपका नाम क्या है?</p>
  <label for="hindi-voice">हिंदी आवाज़ चुनें</label>
  <select id="hindi-voice"><option value="">आवाज़ खोज रहे हैं…</option></select>
  <div class="actions">
    <button type="button" id="test-audio" class="button secondary">▶ आवाज़ सुनें</button>
    <button type="button" id="test-pronunciation" class="button secondary">ट ठ ड ढ ण जाँचें</button>
    <button type="button" id="stop-audio" class="button subtle">■ आवाज़ रोकें</button>
  </div>
  <p id="audio-status" role="status">पहले सुनकर जाँचें। केवल हिंदी का नाम दिखना सही उच्चारण की गारंटी नहीं है।</p>
</details>
