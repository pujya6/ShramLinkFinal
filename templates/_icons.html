{% macro icon(name, cls='') -%}

{% elif name=='pin' %}<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>
{% elif name=='clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>
{% elif name=='person' %}<circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/>
{% elif name=='check' %}<path d="m5 12 4 4L19 6"/><circle cx="12" cy="12" r="10"/>

{% elif name=='arrow' %}<path d="M4 12h16m-6-6 6 6-6 6"/>
{% elif name=='shield' %}<path d="m12 2 9 4v6c0 5-9 10-9 10S3 17 3 12V6l9-4Z"/><path d="m8 12 3 3 5-6"/>
{% else %}<path d="M4 6h16M4 12h16M4 18h10"/>{% endif %}

{%- endmacro %}
